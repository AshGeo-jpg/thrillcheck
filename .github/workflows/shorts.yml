# Makes the day's spoiler-free Shorts every morning from the live ratings (schedule in shorts_config.json).
# Download them from the Actions tab: open the latest "Make Shorts" run, then "Artifacts".
name: Make Shorts
on:
  schedule:
    - cron: "17 14 * * *"     # every day around 8:17 AM Central
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Get the live ratings
        run: |
          mkdir -p data
          curl -sfL -o data/live_games.json https://thrillcheck.com/data/games.json
      - name: Recent games used (no scores)
        run: |
          python - <<'PY'
          import json, datetime
          d = json.load(open("data/live_games.json"))
          cut = (datetime.date.today() - datetime.timedelta(days=150)).isoformat()
          keep = [{k: v for k, v in g.items() if k != "final"} for g in d["games"] if g["date"] >= cut]
          for g in keep:
              print("GAME|" + json.dumps(g, separators=(",", ":")))
          PY
      - name: Make today's Shorts (formats and schedule are in shorts_config.json)
        run: python make_short.py --daily --games data/live_games.json
      - uses: actions/upload-artifact@v4
        with:
          name: thrillcheck-shorts
          path: shorts/
          retention-days: 14
