# Rebuilds Thrillcheck every 30 minutes (GitHub may run it a little less often):
#   1. Pulls finished games from ESPN's free public feed (NFL, NBA, Premier League, La Liga).
#   2. Downloads the free nflverse / hoopR play-by-play as a backup for NFL and NBA.
#   3. Rates every game, rebuilds the site and publishes it to GitHub Pages.
# Costs nothing: no API keys needed.
# Keep the repository PUBLIC so GitHub Actions minutes are free and unlimited.
name: Update Thrillcheck
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://thrillcheck.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas pyarrow requests pillow
      - name: Keep ESPN data between runs (each finished game or matchday is fetched once)
        uses: actions/cache@v4
        with:
          path: results/espn_cache.json
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - name: Keep share images between runs (only new or rescored games are drawn)
        uses: actions/cache@v4
        with:
          path: site/og
          key: og2-${{ github.run_id }}
          restore-keys: og2-
      - name: Download play-by-play data
        run: |
          mkdir -p data
          for y in 2025 2026; do
            curl -sfL -o data/pbp_$y.parquet https://github.com/nflverse/nflverse-data/releases/download/pbp/play_by_play_$y.parquet || rm -f data/pbp_$y.parquet
          done
          for y in 2026 2027; do
            curl -sfL -o data/nba_pbp_$y.parquet https://raw.githubusercontent.com/sportsdataverse/hoopR-nba-data/main/nba/pbp/parquet/play_by_play_$y.parquet || rm -f data/nba_pbp_$y.parquet
          done
      - name: Pull finished games from ESPN
        run: python espn.py
      - name: Rate games and build the site
        run: python build_site.py --site-url "$SITE_URL"
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/deploy-pages@v4
        with: { timeout: 1800000 }
